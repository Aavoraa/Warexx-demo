function paintAskBar(){
  const mic=document.getElementById('amic'), go=document.getElementById('ago'), q=document.getElementById('aq');
  if(!mic) return;
  const listening=S.ask.state==='listening';
  mic.classList.toggle('listening', listening);
  mic.innerHTML=icon(listening?'stop':'mic');
  mic.setAttribute('aria-label', listening?'Stop listening':'Ask by voice');
  mic.disabled = !S.online;
  go.disabled = !S.online || S.ask.state==='processing';
  q.disabled = S.ask.state==='processing';
}

function paintAskBody(){
  const body=document.getElementById('abody'); if(!body) return;
  paintAskBar();
  const a=S.ask, st=a.state||'idle';
  let top='';
  if(!S.online && st!=='result') top=stateCard('muted','wifi','You’re offline.','Questions need a connection to the WAREXX server. Your work on other screens is unaffected.');
  else if(st==='listening') top=`<div class="vstate"><span class="bars"><i></i><i></i><i></i><i></i></span><span>${esc(ASK_STATE.listening)}</span></div>${a.heard?`<div class="heard">${esc(a.heard)}</div>`:''}`;
  else if(st==='processing') top=`<div class="vstate"><span class="bars"><i></i><i></i><i></i><i></i></span><span>${esc(ASK_STATE.processing)}</span></div><div class="heard">${esc(a.text||'')}</div>`;
  else if(st==='denied') top=stateCard('err','lock','Microphone access is required.', a.native
      ? (a.forever ? 'Voice needs the microphone, which is turned off for WAREXX. Turn it on in Settings, then try again. You can type your question meanwhile.'
                   : 'Allow the microphone when the phone asks, then try again. You can type your question meanwhile.')
      : 'Allow the microphone for this site (the lock icon beside the address), then try again. You can type your question meanwhile.',
      (a.native && window.AndroidHost && window.AndroidHost.openSettings) ? '<div class="follow"><button id="micset">Open settings</button></div>' : '');
  else if(st==='unsupported') top=stateCard('muted','mic','Voice isn’t available here.', a.why||'This browser can’t listen. Type your question instead — it gives the same answer.');
  else if(st==='error') top=stateCard('err','alert', a.title||'I couldn’t understand that.', a.why||'Try again, or type your question.');
  else if(st==='result' && a.result) top=resultHTML(a.result);
  else top=`<div class="vstate">${icon('mic')}<span>${S.online?'Tap the microphone and speak, or type below.':'Offline'}</span></div>
      <div class="rows">${askSugs().map((s,i)=>`<button class="rw" data-sug="${i}"><span class="tx"><span class="t" style="display:block;font-weight:500">${esc(s)}</span></span><span class="chev">${icon('chev')}</span></button>`).join('')}</div>`;
  const hist=(a.history||[]).filter((h,i)=>!(st==='result'&&i===0));
  body.innerHTML = top + (hist.length?`<div class="hist"><div class="cc-hd"><h2>Earlier</h2></div><div class="rows">${
      hist.map((h,i)=>`<button class="rw" data-h="${i}"><span class="tx"><span class="t" style="display:block">${esc(h.q)}</span><span class="s" style="display:block">${esc(h.line||'')}</span></span><span class="chev">${icon('chev')}</span></button>`).join('')}</div></div>`:'');
  body.querySelectorAll('[data-sug]').forEach(b=>b.onclick=()=>askText(askSugs()[+b.dataset.sug],'tap'));
  body.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{ const h=hist[+b.dataset.h]; if(h.result){ askSet({state:'result', result:h.result, context:h.result.context}); } else askText(h.q,'tap'); });
  if(st==='result' && a.result) wireResult(body, a.result);
  const ms=document.getElementById('micset'); if(ms) ms.onclick=()=>window.AndroidHost.openSettings();
}
// The server's suggestions carry a product code that is really in this warehouse
// ("Where is product …?"); until they arrive, the ones that need no code.
const BASE_SUGS=['What needs my attention today?','Show pending GRNs','Show today’s inward stock',
  'Show pending purchase orders','Show low stock items','Show recent activity'];
const sugList=()=> (S.cc && S.cc.suggestions && S.cc.suggestions.length) ? S.cc.suggestions : BASE_SUGS;
const askSugs=()=>{ const out=sugList().slice();
  for(const s of ['Show today’s GRNs','Show transfers to receive','Show overdue purchase orders',
                  'Show today’s outward stock','Show stock movements']) if(!out.includes(s)) out.push(s);
  return out; };

function stateCard(tone, ic, title, text, extra){
  return `<div class="rcard state ${tone}">${icon(ic)}<div style="flex:1;min-width:0"><b>${esc(title)}</b><p>${esc(text||'')}</p>${extra||''}</div></div>`;
}

const KIND_LABEL={list:'Result', product:'Product', record:'Record', stat:'Answer', confirm:'Confirm', done:'Done'};
function resultHTML(r){
  const said = r.text ? `<div class="heard">${esc(r.text)}</div>` : '';
  const read = r.intent && r.intent.reading ? `<div class="readas">Read as: ${esc(r.intent.reading)}${
    r.intent.filters && r.intent.filters.warehouse ? ' · '+esc(r.intent.filters.warehouse) : ''}${
    r.intent.filters && r.intent.filters.supplier ? ' · supplier '+esc(r.intent.filters.supplier) : ''}</div>` : '';
  if(r.kind==='refused') return said+stateCard('err','lock','Not available', r.line);
  if(r.kind==='unknown') return said+stateCard('muted','help', r.demo?r.title:'I couldn’t understand that.', r.demo?r.line:'Try asking one of these:',
      `<div class="follow">${(r.actions||[]).map((x,i)=>`<button data-ra="${i}">${esc(x.label)}</button>`).join('')}</div>`);
  if(r.kind==='error') return said+stateCard('err','alert', r.title||'Couldn’t answer', r.line);
  if(r.kind==='unsupported') return said+read+stateCard('muted','help', r.title||'Not available yet', r.line);
  if(r.kind==='empty') return said+read+stateCard('muted','search', r.title, r.line||'I couldn’t find anything matching that.',
      r.open?`<div class="follow"><button data-ro="1">Open the screen</button></div>`:'');
  if(r.kind==='open') return said+stateCard('ok','check', 'Opening…', r.line);
  if(r.kind==='done') return stateCard(r.title?'muted':'ok', r.title?'help':'check', r.title||'Done', r.line);
  const groups=[]; (r.items||[]).forEach((it,i)=>{ const g=it.group||''; let gr=groups.find(x=>x.g===g); if(!gr) groups.push(gr={g,rows:[]}); gr.rows.push([it,i]); });
  const more = (r.total||0) > (r.items||[]).length && r.kind!=='confirm';
  const acts = (r.actions||[]).map((x,i)=>`<button data-ra="${i}">${esc(x.label)}</button>`).join('');
  return said+read+`<div class="rcard ${r.kind==='confirm'?'confirm':''}">
    <div class="rc-hd"><div class="rc-k">${esc(KIND_LABEL[r.kind]||'Result')}</div><div class="rc-t">${esc(r.title)}</div>${r.line?`<div class="rc-l">${esc(r.line)}</div>`:''}</div>
    ${(r.metrics||[]).length?`<div class="rc-m">${r.metrics.slice(0,4).map(m=>`<div><b>${esc(m.value)}</b><small>${esc(m.label)}</small></div>`).join('')}</div>`:''}
    ${groups.map(g=>(g.g?`<div class="rc-grp">${esc(g.g)}</div>`:'')+`<div class="rows">${g.rows.map(([it,i])=>rowHTML(it,i)).join('')}</div>`).join('')}
    ${r.note?`<div class="rc-note">${esc(r.note)}</div>`:''}
    ${r.kind==='confirm'
      ? `<div class="rc-acts"><button id="rcno">Cancel</button><button class="acc" id="rcyes">${esc(r.confirm.label||'Confirm')}</button></div>`
      : (more||acts?`<div class="rc-acts">${more?`<button class="pri" id="rcall">View all ${fmtN(r.total)}</button>`:''}${acts}</div>`:'')}
  </div>`;
}

function wireResult(body, r){
  body.querySelectorAll('[data-row]').forEach(b=>b.onclick=(e)=>{
    if(e.target.closest('[data-act]')) return;
    const it=r.items[+b.dataset.row];
    if(it.open) return goOpen(it.open,'ask');
    if(it.action && it.action.intent) askIntent(it.action.intent, it.title);
  });
  body.querySelectorAll('[data-act]').forEach(b=>b.onclick=(e)=>{ e.stopPropagation(); const it=r.items[+b.dataset.act];
    askIntent(it.action.intent, (it.action.label||'')+' '+it.title); });
  body.querySelectorAll('[data-ra]').forEach(b=>b.onclick=()=>{ const x=(r.actions||[])[+b.dataset.ra]; if(!x) return;
    if(x.open) return goOpen(x.open,'ask'); if(x.intent) return askIntent(x.intent, x.label); if(x.ask) return askText(x.ask,'tap'); });
  const ro=body.querySelector('[data-ro]'); if(ro) ro.onclick=()=>goOpen(r.open,'ask');
  const all=document.getElementById('rcall'); if(all) all.onclick=()=>askIntent(Object.assign({}, r.intent, {all:true}), 'All — '+r.title);
  const no=document.getElementById('rcno'); if(no) no.onclick=()=>{ askSet({state:'result', result:{kind:'done', line:'Cancelled — nothing was changed.'}}); speakOut('Cancelled.'); };
  const yes=document.getElementById('rcyes'); if(yes) yes.onclick=()=>doConfirm(r, yes);
}

// The one place an action is carried out — and only here, after the person has
// read the card and pressed Confirm. It calls the route the card names, the same
// route the desktop's own button calls, so the server's checks are the same too.
async function doConfirm(r, btn){
  const c=r.confirm; if(!c) return;
  if(!S.online){ toast("You're offline. This action requires a connection."); return; }
  btn.disabled=true; btn.textContent='Working…';
  const no=document.getElementById('rcno'); if(no) no.disabled=true;
  try{
    const h = c.warehouse_id ? {'X-Essa-Warehouse': String(c.warehouse_id)} : {};
    const res = await api(c.path, {method:c.method||'POST', body:JSON.stringify(c.body||{}), headers:h});
    S.cc=null;
    if(res && res.demo===true){
      // the live demo acknowledges the request and keeps nothing — said as that
      askSet({state:'result', result:{kind:'done', title:'Simulated in the demo',
        line:`In the live app: ${c.done||'done'} This sample business keeps nothing, so the data is unchanged.`}});
      return;
    }
    toast('✓ '+(c.done||'Done'));
    speakOut(c.done||'Done.');
    if(c.then) return goOpen(c.then,'ask');
    askSet({state:'result', result:{kind:'done', line:c.done||'Done.'}});
  }catch(e){
    askSet({state:'result', result:{kind:'error', title:'That didn’t go through',
      line: e.network ? e.message+' It may not have reached the server — check before trying again.'
                      : (e.message||'The server refused it.')+' Nothing was changed.'}});
  }
}

async function askText(text, source){ return runCommand({text, source}, text); }
async function askIntent(intent, label){ return runCommand({intent, source:'tap'}, label||''); }
async function runCommand(payload, label){
  if(S.screen!=='ask'){ S.askBack = S.screen==='ask'?S.askBack:S.screen; S.screen='ask'; render(); }
  stopVoice(true);
  if(!S.online){ askSet({state:'error', title:"You're offline.", why:'This needs a connection to the WAREXX server.'}); return; }
  const q=document.getElementById('aq'); if(q) q.value='';
  askSet({state:'processing', text:label});
  const seq=(S.askSeq=(S.askSeq||0)+1);
  // A slow server gets a word after a few seconds rather than an endless spinner.
  const slow=setTimeout(()=>{ if(S.askSeq===seq && S.ask.state==='processing'){ const v=document.querySelector('.vstate span:last-child'); if(v) v.textContent='Still working on it…'; } }, 4000);
  try{
    const r = await api('/api/assist/command', {method:'POST',
      body:JSON.stringify(Object.assign({context:S.ask.context||null}, payload))});
    if(seq!==S.askSeq) return;                         // a newer question has been asked
    if(!r.text) r.text = label;
    const hist=[{q:label||r.title, line:r.line, result:r}].concat((S.ask.history||[]).filter(h=>h.q!==label)).slice(0,6);
    S.ask.context = r.context;
    if(r.kind==='open' && r.open){ askSet({state:'result', result:r, history:hist}); return goOpen(r.open,'ask'); }
    askSet({state:'result', result:r, history:hist});
    if(payload.source==='voice') speakOut(r.speak||r.line);
  }catch(e){
    if(seq!==S.askSeq) return;
    askSet({state:'error', title: e.network?(S.online?'Can’t reach the server.':'You’re offline.'):'Couldn’t answer that.', why:e.message});
  }finally{ clearTimeout(slow); }
}

function speakOut(text){
  if(!S.speak || !text || !window.speechSynthesis) return;
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(String(text).slice(0,300)); u.lang='en-IN'; u.rate=1.02; speechSynthesis.speak(u); }catch(e){}
}

// ---------- voice in ----------
// Two engines, one behaviour. In the Android app the WebView has no speech
// recognition of its own (and none over the LAN's plain http), so the app hands
// it to Android's recogniser through AndroidHost.listen(). In a browser it is
// the Web Speech API. Either way the words come back as text and go through
// askText — the same request a typed question makes.
const Voice = {
  native(){ return !!(window.AndroidHost && typeof window.AndroidHost.listen==='function'); },
  Web(){ return window.SpeechRecognition || window.webkitSpeechRecognition || null; },
  rec:null,
};
function startVoice(){
  if(window.speechSynthesis) try{ speechSynthesis.cancel(); }catch(e){}
  if(!S.online) return askSet({state:'error', title:"You're offline.", why:'Voice questions need a connection to the WAREXX server.'});
  if(Voice.native()){
    askSet({state:'listening', heard:'', native:true});
    try{ window.AndroidHost.listen('en-IN'); }catch(e){ askSet({state:'unsupported', why:'The phone’s speech service couldn’t start.'}); }
    return;
  }
  const W=Voice.Web();
  if(!W) return askSet({state:'unsupported', native:false,
    why: window.AndroidHost ? 'This version of the WAREXX app can’t listen yet — update it, or type your question.'
       : (!window.isSecureContext ? 'The browser only allows the microphone on a secure (https) address. Type your question instead.'
       : 'This browser can’t listen. Type your question instead — it gives the same answer.')});
  try{
    const rec=new W(); Voice.rec=rec;
    rec.lang='en-IN'; rec.interimResults=true; rec.maxAlternatives=1; rec.continuous=false;
    let final='', got=false;
    rec.onresult=(e)=>{
      let interim='';
      for(let i=e.resultIndex;i<e.results.length;i++){
        if(e.results[i].isFinal) final+=e.results[i][0].transcript; else interim+=e.results[i][0].transcript;
      }
      S.ask.heard=(final||interim).trim();
      const h=document.querySelector('#abody .heard'); if(h) h.textContent=S.ask.heard; else paintAskBody();
    };
    rec.onerror=(e)=>{
      got=true; Voice.rec=null;
      const map={'not-allowed':['denied'], 'service-not-allowed':['denied'],
        'no-speech':['error','I didn’t hear anything.','Tap the microphone and speak — or type your question.'],
        'audio-capture':['error','No microphone was found.','Connect one, or type your question.'],
        'network':['error','Voice recognition couldn’t reach its service.','Type your question instead.'],
        'aborted':['idle']};
      const m=map[e.error]||['error','I couldn’t understand that.','Try again, or type your question.'];
      askSet({state:m[0], title:m[1], why:m[2], native:false});
    };
    rec.onend=()=>{
      Voice.rec=null;
      if(got) return;
      const words=(final||S.ask.heard||'').trim();
      if(words) return askText(words,'voice');
      if(S.ask.state==='listening') askSet({state:'error', title:'I didn’t hear anything.', why:'Tap the microphone and speak — or type your question.'});
    };
    askSet({state:'listening', heard:'', native:false});
    rec.start();
  }catch(e){ askSet({state:'unsupported', why:'The microphone couldn’t be started here. Type your question instead.'}); }
}
function stopVoice(silent){
  if(Voice.native() && S.ask.state==='listening' && window.AndroidHost.stopListening){ try{ window.AndroidHost.stopListening(); }catch(e){} }
  if(Voice.rec){ try{ silent ? Voice.rec.abort() : Voice.rec.stop(); }catch(e){} if(silent) Voice.rec=null; }
  if(silent && S.ask.state==='listening') S.ask.state='idle';
}
// Android hands the recognised words (or why there are none) back here.
window.__essaVoiceResult = function(text, err){
  if(S.screen!=='ask') return;
  if(text){ S.ask.heard=text; return askText(text,'voice'); }
  const map={denied:['denied'], denied_forever:['denied'], cancelled:['idle'],
             audio:['error','No microphone was found.','Check the phone’s microphone, or type your question.'],
             language:['error','Speech recognition isn’t set up for English (India) on this phone.','Type your question instead.'], unavailable:['unsupported',null,'This phone has no speech recognition service. Type your question instead.'],
             nomatch:['error','I couldn’t understand that.','Try again, or type your question.'],
             nospeech:['error','I didn’t hear anything.','Tap the microphone and speak — or type your question.'],
             network:['error','Voice recognition needs a connection.','Type your question instead.']};
  const m=map[err]||map.nomatch;
  askSet({state:m[0], title:m[1], why:m[2], native:true, forever: err==='denied_forever'});
};
// …and, while it listens, what state it is in and what it has heard so far.
window.__essaVoiceState = function(st){
  if(S.screen!=='ask') return;
  if(st==='listening' && S.ask.state!=='listening') askSet({state:'listening', heard:'', native:true});
  if(st==='processing' && S.ask.state==='listening') askSet({state:'processing', text:S.ask.heard||''});
};
window.__essaVoiceHeard = function(text){
  if(S.screen!=='ask' || S.ask.state!=='listening') return;
  S.ask.heard=text;
  const h=document.querySelector('#abody .heard'); if(h) h.textContent=text; else paintAskBody();
};
// The Android Back button asks the page first: an open picker, a scanner, or the
// microphone listening is closed before Back moves to the previous screen.
window.__essaBack = function(){
  const sh=document.querySelector('.sheet'); if(sh){ sh.remove(); return true; }
  if(document.getElementById('scanov')){ closeScanner(); return true; }
  if(S.ask && S.ask.state==='listening'){ stopVoice(true); paintAskBody(); return true; }
  return false;
};

// ==========================================================================
//  Addresses: every main screen has its own, under /m
//
//  /m  /m/ask  /m/operations  /m/inventory  /m/inventory/<code>  /m/grn
//  /m/grn/<id>  /m/purchase-orders  /m/purchase-orders/<id>  /m/transfers
//  /m/transfers/<id>  /m/consignments  /m/consignments/<id>  /m/stock-movement
//  /m/low-stock  /m/scan  /m/notifications  /m/profile  …
//
//  The screens stay what they were — S.screen and render() — and the address
//  follows them, so a link opens a screen, a reload stays on it, and the phone's
//  Back button walks back through them. The server answers every /m/… address
//  with this page (main.mobile_asset); so does the live demo.
// ==========================================================================
const VIEWS = {   // screens that are one Ask WAREXX answer, given a page of their own
  'stock-movement':{intent:'MOVEMENTS', title:'Stock movement'},
  'low-stock':{intent:'LOW_STOCK', title:'Low stock'},
  'outward':{intent:'OUTWARD', title:'Stock outward'},
  'inward':{intent:'INWARD', title:'Stock inward'},
  'pending-grns':{intent:'PENDING_GRN', title:'Pending GRNs'},
  'shortages':{intent:'SHORTAGES', title:'Shortages'},
  'invoices':{intent:'INVOICE_REVIEW', title:'Invoices to review'},
  'activity':{intent:'ACTIVITY', title:'Recent activity'},
  'overdue-orders':{intent:'PO_OVERDUE', title:'Overdue purchase orders'},
};
const SIMPLE_URL = {home:'/m', ask:'/m/ask', ops:'/m/operations', list:'/m/inventory', grn:'/m/grn',
  lr:'/m/consignments', bundles:'/m/bundles', audit:'/m/audit', polist:'/m/purchase-orders',
  transfers:'/m/transfers', scan:'/m/scan', notifs:'/m/notifications', more:'/m/profile'};
function urlOf(){
  const s=S.screen;
  if(SIMPLE_URL[s]) return SIMPLE_URL[s];
  if(s==='grndetail' && S.grn) return '/m/grn/'+S.grn.id;
  if(s==='lrdetail' && S.lrSel && S.lrSel.id) return '/m/consignments/'+S.lrSel.id;
  if(s==='po' && S.po) return '/m/purchase-orders/'+S.po.id;
  if(s==='transfer' && S.tr) return '/m/transfers/'+S.tr.id;
  if(s==='item' && S.itemCode) return '/m/inventory/'+encodeURIComponent(S.itemCode);
  if(s==='view' && S.view) return '/m/'+S.view.slug;
  return null;                       // a working screen (a breakdown, a form): the address stays put
}
let routing=false;
function syncUrl(){
  if(!S.token || routing) return;
  const u=urlOf();
  if(!u || u===location.pathname) return;
  try{ history.pushState({m:1}, '', u); S.navDepth=(S.navDepth||0)+1; }catch(e){}
}
// An address → its screen. `replace`: the boot and the Back button, which must
// not add a history entry of their own.
async function applyRoute(path, replace){
  const p=(path||'/m').replace(/\/+$/,'') || '/m';
  let m;
  routing=true;
  try{
    if(p==='/m' || p==='/m/command-centre' || p==='/m/home'){ S.screen='home'; return render(); }
    const simple=Object.entries(SIMPLE_URL).find(([,u])=>u===p);
    if(simple){ if(simple[0]==='audit'){ S.audit=undefined; S.lastScan=null; } S.screen=simple[0]; return render(); }
    if(p==='/m/dashboard') { S.screen='home'; return render(); }
    if((m=p.match(/^\/m\/grn\/(\d+)$/))) return await openGrn(+m[1]);
    if((m=p.match(/^\/m\/consignments\/(\d+)$/))) return await goOpen({screen:'lr', id:+m[1]});
    if((m=p.match(/^\/m\/purchase-orders\/(\d+)$/))) return await openPO(+m[1], 'polist');
    if((m=p.match(/^\/m\/transfers\/(\d+)$/))) return await openTransfer(+m[1], 'transfers');
    if((m=p.match(/^\/m\/inventory\/(.+)$/))) return await openItem(decodeURIComponent(m[1]), null, 'list');
    if((m=p.match(/^\/m\/([a-z-]+)$/)) && VIEWS[m[1]]) return await openView(m[1], 'ops');
    S.screen='home'; return render();          // an address this version doesn't know
  }finally{
    routing=false;
    const u=urlOf();
    if(u && u!==location.pathname){ try{ history[replace?'replaceState':'pushState']({m:1}, '', u); if(!replace) S.navDepth=(S.navDepth||0)+1; }catch(e){} }
  }
}
window.addEventListener('popstate', ()=>{ S.navDepth=Math.max(0,(S.navDepth||0)-1);
  if(S.token && S.screen!=='login') { stopVoice(true); applyRoute(location.pathname, true); } });

// a page with the bar on top: title, optional Back, optional right-hand control
function pageTop(title, back, right){
  return `<div class="topbar">${back?'<button class="link" id="back">‹ Back</button>':''}<h1>${esc(title)}<span class="demotag">DEMO</span></h1>${right||''}</div>`;
}
function wireBack(fallback){
  const b=document.getElementById('back');
  // Back is the phone's Back: the screen this one was opened from. Opened
  // straight from a link (nothing behind it in this app), it goes up a level.
  if(b) b.onclick=()=>{ if((S.navDepth||0)>0) history.back(); else { S.screen=fallback; render(); } };
}
const loadingHTML='<div class="spin"></div>';
const plural=(n,w)=>`${fmtN(n)} ${w}${Number(n)===1?'':'s'}`;
const failHTML=(msg, retryId)=>stateCard('err','alert','Couldn’t load this.', msg, retryId?`<div class="follow"><button id="${retryId}">Try again</button></div>`:'');
const badge=(status, tone)=>`<span class="st ${tone||toneOf(status)}">${esc(status||'')}</span>`;
function toneOf(st){
  st=String(st||'').toLowerCase();
  if(/(posted|confirmed|received|done|ok|stored|detailed)/.test(st)) return 'ok';
  if(/(cancel|short|refused|fail|missing)/.test(st)) return 'err';
  if(/(transit|arriving|sent)/.test(st)) return 'info';
  if(/(draft|pending|open|review)/.test(st)) return 'warn';
  return '';
}
const dmy=(iso)=>{ if(!iso) return ''; const d=new Date(String(iso).length<=10?iso+'T00:00:00':iso); return isNaN(d)?String(iso):d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); };

    <div class="cc-hd"><h2>Items</h2></div>
    <div class="rows">${(o.lines||[]).map((l,i)=>rowHTML({title:l.description||('Item '+(i+1)), sub:l.barcode||'',
        value:fmtN(l.qty)+' pcs', extra:o.status==='received'?('accepted '+fmtN(l.accepted_qty)):'', tone:l.short_qty>0?'err':'',
        open:!!l.product_id}, i)).join('')||stateCard('muted','box','No items','This draft has no lines yet.')}</div>
    ${o.received_by||o.received_date?`<div class="cc-hd"><h2>Received</h2></div><div class="kv">${[['By',o.received_by],['On',o.received_date&&dmy(o.received_date)],['Short',o.shortfall?fmtN(o.shortfall)+' pcs':'']]
      .filter(([,v])=>v).map(([k,v])=>`<div><span>${k}</span><b>${esc(v)}</b></div>`).join('')}</div>`:''}
  </div>
  ${canReceive?`<div class="sticky"><button class="acc" id="trrecv">Receive this transfer</button></div>`:''}`;
  wireBack(S.trBack||'transfers');
  app.querySelectorAll('[data-row]').forEach(b=>b.onclick=()=>{ const l=o.lines[+b.dataset.row]; if(l&&l.product_id) openItem(null, l.product_id, 'transfer'); });
  const rv=document.getElementById('trrecv');
  // the same confirmation Ask WAREXX gives: what will be accepted, then Confirm
  if(rv) rv.onclick=()=>askIntent({intent:'RECEIVE_TRANSFER', action:'CREATE', filters:{transfer_id:o.id}}, 'Receive '+(o.code||'this transfer'));
}

// ---------- One item: what it is, how much, where, what happened to it ----------
async function openItem(code, id, back){
  S.itemBack=back||S.screen;
  S.item=null; S.itemErr=null; S.itemCode=code||null;
  if(!code && id){
    // a product id only (a transfer line): its code first, so the address can carry it
    try{ const p=await api('/api/inventory/products/'+id); S.itemCode=p.sku||String(id); }catch(e){ S.itemCode=String(id); }
  }
  S.screen='item'; render();
}
async function renderItem(){
  app.innerHTML=pageTop('Item', true)+`<div class="pg" id="itm">${loadingHTML}</div>`;
  wireBack(S.itemBack||'list');
  const el=document.getElementById('itm');
  let r=S.item;
  if(!r){
    try{ r=await api('/api/inventory/locate?code='+encodeURIComponent(S.itemCode||'')); S.item=r; }
    catch(e){
      if(S.screen!=='item') return;
      el.innerHTML = e.network ? failHTML(e.message,'itr')
        : stateCard('muted','search','Not found', `No product, piece or carton matches “${S.itemCode}” in the warehouses. `
            +'Store-only items are kept by the shop’s till.');
      const t=document.getElementById('itr'); if(t) t.onclick=renderItem;
      return;
    }
  }
  if(S.screen!=='item') return;
  if(r.kind==='bundle'){
    const b=r.bundle||{};
    el.innerHTML=`<div class="hero"><div class="k">Carton</div><h2>${esc(b.code||r.code)}</h2>
      <div class="s">${esc([b.location&&('at '+b.location), b.grn_no, b.supplier_name].filter(Boolean).join(' · '))}</div>
      <div style="margin-top:10px">${badge(b.status)}</div></div>
      <div class="cc-hd"><h2>Inside</h2></div><div class="rows">${(b.items||[]).map((x,i)=>rowHTML({title:x.description||x.sku, sub:x.sku, value:fmtN(x.stock_qty!=null?x.stock_qty:x.qty)+' pcs', open:!!x.sku}, i)).join('')||stateCard('muted','box','Empty','')}</div>`;
    el.querySelectorAll('[data-row]').forEach(bt=>bt.onclick=()=>{ const x=b.items[+bt.dataset.row]; if(x.sku) openItem(x.sku,null,'item'); });
    return;
  }
  const p=r.product||{}, ws=r.warehouse_stock||{}, pr=r.pricing||{}, age=r.age||{};
  const attrs=[p.brand,p.size,p.color,p.material,p.fit].filter(Boolean).join(' · ');
  const cartons=(r.cartons||[]).filter(c=>c.status!=='emptied');
  const moves=(r.movements||[]).slice(0,8);
  el.innerHTML=`<div class="hero"><div class="k">${esc(p.category||'Product')}</div><h2>${esc(p.name||p.description||p.sku)}</h2>
      <div class="s">${esc([p.sku, attrs].filter(Boolean).join(' · '))}</div>
      ${r.unit?`<div style="margin-top:10px">${badge('piece #'+(r.unit.seq||'')+' · '+(r.unit.status||''),'info')}</div>`:''}
      <div class="rc-m"><div><b>${fmtN(ws.stock!=null?ws.stock:p.stock_qty)}</b><small>Available</small></div>
        <div><b>${p.sale_price!=null?'₹'+fmtN(p.sale_price):(p.mrp!=null?'₹'+fmtN(p.mrp):'—')}</b><small>${p.sale_price!=null?'Selling price':'MRP'}</small></div>
        <div><b>${age.days!=null?fmtN(age.days)+'d':'—'}</b><small>In stock for</small></div></div></div>
    <div class="cc-hd"><h2>Where it is</h2><small>${cartons.length?plural(cartons.length,'carton'):''}</small></div>
    ${cartons.length?`<div class="rows">${cartons.map((c,i)=>rowHTML({title:c.location||'Not put away', sub:[c.code, c.grn_no].filter(Boolean).join(' · '), value:fmtN(c.qty)+' pcs', status:c.status, tone:toneOf(c.status)}, i)).join('')}</div>`
      : stateCard('muted','pin','No carton locations','It hasn’t been put away in a labelled carton.')}
    ${(r.locations||[]).length?`<div class="cc-hd"><h2>Sent to</h2></div><div class="rows">${r.locations.map((l,i)=>rowHTML({title:l.location, sub:plural(l.notes||0,'transfer'), value:fmtN(l.accepted!=null?l.accepted:l.sent)+' pcs', extra:l.short_by?('short '+fmtN(l.short_by)):''}, i)).join('')}</div>`:''}
    <div class="cc-hd" id="mvhd"><h2>Stock movement</h2><small>${moves.length?'latest '+moves.length:''}</small></div>
    ${moves.length?`<div class="rows">${moves.map((m,i)=>rowHTML({title:(m.kind||'').replace(/^./,c=>c.toUpperCase())+' '+(m.qty_delta>0?'+':'')+fmtN(m.qty_delta),
        sub:m.note||'', value:'bal '+fmtN(m.balance_after), when:dmy(m.at), tone:m.qty_delta>0?'ok':'info'}, i)).join('')}</div>`
      : stateCard('muted','swap','No movements yet','')}
    ${(r.receipts||[]).length?`<div class="cc-hd"><h2>Received on</h2></div><div class="rows" id="itgr">${r.receipts.slice(0,5).map((g,i)=>rowHTML({title:g.grn_no||'GRN', sub:[g.supplier, g.invoice_number&&('Inv '+g.invoice_number)].filter(Boolean).join(' · '),
        value:fmtN(g.qty)+' pcs', when:dmy(g.posted_at), status:g.status, open:!!g.purchase_id}, i)).join('')}</div>`:''}
    ${pr.cost!=null?`<div class="cc-hd"><h2>Price</h2></div><div class="kv">${[['Cost','₹'+money(pr.cost)],['MRP',pr.mrp!=null?'₹'+money(pr.mrp):''],['Selling price',pr.sale_price!=null?'₹'+money(pr.sale_price):''],
        ['Margin',pr.margin_pct!=null?pr.margin_pct+'%':'']].filter(([,v])=>v).map(([k,v])=>`<div><span>${k}</span><b>${esc(v)}</b></div>`).join('')}</div>`:''}
  `;
  app.insertAdjacentHTML('beforeend',`<div class="sticky"><button id="itdet">Edit details</button><button id="itmv">Movement</button><button class="pri" id="ittr">Transfer</button></div>`);
  const gr=r.receipts||[];
  el.querySelectorAll('#itgr [data-row]').forEach(b=>{ const g=gr[+b.dataset.row]; if(g && g.purchase_id) b.onclick=()=>openGrn(g.purchase_id); });
  document.getElementById('itdet').onclick=()=>openItemDetail(p.product_id,'item');
  document.getElementById('itmv').onclick=()=>askIntent({intent:'MOVEMENTS', filters:{code:p.sku}}, 'Stock movement for '+p.sku);
  document.getElementById('ittr').onclick=()=>startTransfer();
}

// ---------- Scan: the phone's camera (or the Android app's scanner), a typed code ----------
async function renderScan(){
  const native=!!(window.AndroidHost && typeof window.AndroidHost.scan==='function');
  const camera=native || ('BarcodeDetector' in window && navigator.mediaDevices && window.isSecureContext);
  const recent=(S.recentScans||[]);
  const samples=(window.WAREXX_DEMO && window.WAREXX_DEMO.samples)||[];
  app.innerHTML=pageTop('Scan')+`<div class="pg">
    <button class="scanzone" id="scgo" ${camera?'':'aria-disabled="true"'}>
      <span class="frame"><i></i><i></i><i></i><i></i>${icon('scan')}</span>
      <b>${camera?'Tap to scan':'Camera scanning isn’t available here'}</b>
      <small>${camera?'QR code, barcode, carton label or piece tag — the item opens with its stock and where it is.'
        :(window.isSecureContext?'This browser can’t read barcodes. Type the code below, or use a scanner gun.'
          :'The browser only allows the camera on a secure (https) address. Type the code below, or use a scanner gun.')}</small>
    </button>
    <form class="codein" id="scform" autocomplete="off"><input id="sccode" placeholder="Or type / scan a code…" autocapitalize="characters" enterkeyhint="go" aria-label="Product code"><button>Find</button></form>
    ${samples.length?`<div class="cc-hd"><h2>Try a sample code</h2><small>demo labels</small></div>
      <div class="samples">${samples.map(c=>`<button data-sc="${esc(c)}">${esc(c)}</button>`).join('')}</div>`:''}
    ${recent.length?`<div class="cc-hd"><h2>Scanned this session</h2></div><div class="rows">${recent.map((c,i)=>rowHTML({title:c, open:true}, i)).join('')}</div>`:''}
  </div>`;
  const open=(code)=>{ code=String(code||'').trim(); if(!code) return;
    S.recentScans=[code].concat((S.recentScans||[]).filter(x=>x!==code)).slice(0,5);
    openItem(code, null, 'scan'); };
  document.getElementById('scgo').onclick=()=>{ if(!camera){ document.getElementById('sccode').focus(); return; } openScanner(open); };
  document.getElementById('scform').onsubmit=(e)=>{ e.preventDefault(); open(document.getElementById('sccode').value); };
  app.querySelectorAll('[data-sc]').forEach(b=>b.onclick=()=>open(b.dataset.sc));
  app.querySelectorAll('[data-row]').forEach(b=>b.onclick=()=>open(recent[+b.dataset.row]));
}

// ---------- A page that is one answer: stock movement, low stock, outward… ----------
async function openView(slug, back){
  if(!VIEWS[slug]) return;
  S.view={slug, ...VIEWS[slug]}; S.viewBack=back||S.screen; S.viewResult=null; S.viewAll=false;
  S.screen='view'; render();
}
async function renderView(){
  const v=S.view; if(!v){ S.screen='ops'; return render(); }
  app.innerHTML=pageTop(v.title, true)+`<div class="pg" id="vw">${loadingHTML}</div>`;
  wireBack(S.viewBack||'ops');
  const el=document.getElementById('vw');
  try{
    const r=S.viewResult || await api('/api/assist/command',{method:'POST',body:JSON.stringify({intent:{intent:v.intent, filters:{}, all:S.viewAll}, source:'tap'})});
    if(S.screen!=='view') return;
    S.viewResult=r;
    el.innerHTML=resultHTML(Object.assign({}, r, {text:''}));
    const all=document.getElementById('rcall'); if(all) all.onclick=()=>{ S.viewAll=true; S.viewResult=null; renderView(); };
    el.querySelectorAll('[data-row]').forEach(b=>b.onclick=(e)=>{ if(e.target.closest('[data-act]')) return; const it=r.items[+b.dataset.row]; if(it.open) goOpen(it.open,'view'); else if(it.action&&it.action.intent) askIntent(it.action.intent, it.title); });
    el.querySelectorAll('[data-act]').forEach(b=>b.onclick=(e)=>{ e.stopPropagation(); const it=r.items[+b.dataset.act]; askIntent(it.action.intent, it.action.label+' '+it.title); });
    el.querySelectorAll('[data-ra]').forEach(b=>b.onclick=()=>{ const x=(r.actions||[])[+b.dataset.ra]; if(!x) return; if(x.open) return goOpen(x.open,'view'); if(x.intent) return askIntent(x.intent,x.label); if(x.ask) askText(x.ask,'tap'); });
    const ro=el.querySelector('[data-ro]'); if(ro) ro.onclick=()=>goOpen(r.open,'view');
  }catch(e){ el.innerHTML=failHTML(e.message,'vwr'); const t=document.getElementById('vwr'); if(t) t.onclick=()=>{ S.viewResult=null; renderView(); }; }
}

  const row=(id,ic,t,s,right)=>`<button class="rw" id="${id}"><span class="qi" style="width:34px;height:34px;border-radius:9px;background:var(--panel2);display:grid;place-items:center;flex:0 0 auto">${icon(ic)}</span><span class="tx"><span class="t" style="display:block">${t}</span>${s?`<span class="s" style="display:block">${s}</span>`:''}</span>${right||`<span class="chev">${icon('chev')}</span>`}</button>`;
  app.innerHTML=`<div class="topbar"><h1>More</h1></div>
    <div class="more">
      <div class="who"><span class="tb-av">${esc(initials(S.name||S.user))}</span><div style="flex:1;min-width:0"><b>${esc(S.user)}</b><span>${esc(label)}${S.employee?' · '+esc(S.employee):''}</span></div></div>
      <div class="cc-hd" style="margin-top:22px"><h2>Workplace</h2></div>
      <div class="rows">
        ${row('mwh','pin','Warehouse', esc(S.warehouse?S.warehouse.name:'None chosen'))}
        ${row('mnot','bell','Notifications', un?esc(un+' unread'):'Nothing unread', un?`<span class="st warn">${un}</span>`:'')}
      </div>
      <div class="cc-hd" style="margin-top:22px"><h2>Ask WAREXX</h2></div>
      <div class="rows">
        ${row('mspk','speaker','Spoken replies','Read answers aloud after a voice question',`<span class="tgl ${S.speak?'on':''}" id="mtgl"></span>`)}
      </div>
      <div class="cc-hd" style="margin-top:22px"><h2>App</h2></div>
      <div class="rows">
        ${row('mdiag','alert','Connection & alerts','Why alerts may not reach a closed app')}
        ${row('mout','logout','Sign out','')}
      </div>
      ${window.WAREXX_DEMO?`<div class="cc-hd" style="margin-top:22px"><h2>Live demo</h2></div>
      <div class="rows"><div class="rw static"><span class="tx"><span class="t" style="display:block">WAREXX mobile · sample business</span>
        <span class="s" style="display:block;white-space:normal">Explore freely — anything you change is simulated, and the sample data resets when you reload.</span></span></div>
        ${window.AndroidHost?'':`<a class="rw" href="/" style="text-decoration:none"><span class="tx"><span class="t" style="display:block">Open the desktop demo</span></span><span class="chev">${icon('chev')}</span></a>`}
        ${window.WAREXX_DEMO.contact?`<a class="rw" href="${esc(window.WAREXX_DEMO.contact)}" target="_top" style="text-decoration:none"><span class="tx"><span class="t" style="display:block;color:var(--accent2)">Talk to us</span></span><span class="chev">${icon('chev')}</span></a>`:''}</div>`:''}
      ${atLeast('admin')?`<p class="stamp">Masters, reports and payments are on the desktop app.</p>`:''}
      ${(()=>{ try{ const i=window.AndroidHost&&window.AndroidHost.appInfo&&JSON.parse(window.AndroidHost.appInfo()); return i&&i.version?`<p class="stamp">WAREXX for Android ${esc(i.version)}${i.demo?' · demo':''} · ${esc(i.server||'')}</p>`:''; }catch(e){ return ''; } })()}
    </div>`;
  document.getElementById('mwh').onclick=async ()=>{ await loadWarehouses(); S.whBack='more'; S.screen='warehouse'; render(); };
  document.getElementById('mnot').onclick=()=>{ S.screen='notifs'; render(); };
  document.getElementById('mspk').onclick=()=>{ S.speak=!S.speak; try{ localStorage.setItem('essa_speak',S.speak?'1':'0'); }catch(e){}
    document.getElementById('mtgl').classList.toggle('on',S.speak); };
  document.getElementById('mdiag').onclick=()=>{ S.diagBack='more'; S.screen='diag'; render(); };
  document.getElementById('mout').onclick=logout;
}
